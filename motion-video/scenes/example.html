<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>example</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0f17; overflow: hidden; }
  canvas { display: block; }
</style>
<script type="importmap">{ "imports": { "three": "/node_modules/three/build/three.module.js" } }</script>
</head>
<body>
<script type="module">
// サンプル: 1文字ずつ浮かび上がるコピー + 舞う粒子。
// 書き換えるのは LINES(コピーと表示タイミング)と色だけでよい。
import * as THREE from "three";

const LINES = [
  { text: "その手間、",           at: 0.5, out: 3.6 },
  { text: "まだ手でやりますか。", at: 1.4, out: 3.6 },
  { text: "AIに任せて、",         at: 4.0, out: 7.6 },
  { text: "考える時間を取り戻す。", at: 4.9, out: 7.6 },
];
const DURATION = 8;
const FONT = '700 120px "IPAGothic", "Noto Sans JP", sans-serif';
const COLOR = "#f4f1ea";

const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
renderer.setPixelRatio(1);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0b0f17, 8, 22);
const camera = new THREE.PerspectiveCamera(40, W / H, 0.1, 100);
camera.position.set(0, 0, 10);

// 1文字 = 1枚の板。文字はブラウザのフォントで描くので崩れない
function glyph(ch) {
  const c = document.createElement("canvas");
  c.width = c.height = 160;
  const g = c.getContext("2d");
  g.font = FONT; g.fillStyle = COLOR; g.textAlign = "center"; g.textBaseline = "middle";
  g.fillText(ch, 80, 88);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false }));
}

const chars = [];
LINES.forEach((line, li) => {
  const pairIndex = li % 2;           // 2行で1画面
  const y = pairIndex === 0 ? 0.75 : -0.75;
  const n = [...line.text].length;
  [...line.text].forEach((ch, i) => {
    const m = glyph(ch);
    const x = (i - (n - 1) / 2) * 0.82;
    m.userData = { x, y, start: line.at + i * 0.07, out: line.out + i * 0.02, seed: Math.sin((li + 1) * 97 + i * 13) };
    scene.add(m);
    chars.push(m);
  });
});

// 粒子(雪/光の粉)
// Math.random は書き出すたびに結果が変わるので、固定シードの乱数を使う
let s = 42;
const rand = () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
const N = 600, pos = new Float32Array(N * 3), base = [];
for (let i = 0; i < N; i++) base.push([(rand() - 0.5) * 20, (rand() - 0.5) * 12, -rand() * 12, 0.2 + rand() * 0.6]);
const pgeo = new THREE.BufferGeometry();
pgeo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
scene.add(new THREE.Points(pgeo, new THREE.PointsMaterial({ color: 0xc9d6ff, size: 0.07, transparent: true, opacity: 0.7 })));

const ease = (x) => 1 - Math.pow(1 - Math.min(Math.max(x, 0), 1), 3);

window.SCENE = { duration: DURATION };
window.renderAt = (t) => {
  for (const m of chars) {
    const { x, y, start, out, seed } = m.userData;
    const a = ease((t - start) / 0.6);       // 入り
    const b = ease((t - out) / 0.8);         // 抜け
    m.position.set(x, y + (1 - a) * -0.4 + b * 0.6, (1 - a) * -2 + b * 1.5);
    m.rotation.z = (1 - a) * seed * 0.4;
    m.material.opacity = a * (1 - b);
  }
  for (let i = 0; i < N; i++) {
    const [x, y, z, s] = base[i];
    pos[i * 3] = x + Math.sin(t * 0.8 + i) * 0.3 + t * 0.5 * s;
    pos[i * 3 + 1] = ((y - t * s + 6) % 12 + 12) % 12 - 6;
    pos[i * 3 + 2] = z;
  }
  pgeo.attributes.position.needsUpdate = true;
  camera.position.x = Math.sin(t * 0.3) * 0.3;
  camera.lookAt(0, 0, 0);
  renderer.render(scene, camera);
};
window.renderAt(0);
</script>
</body>
</html>
